name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions for coverage reporting
permissions:
  contents: read
  pull-requests: write

jobs:
  # Job 0: Detect which files changed to determine what to run
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      workflows: ${{ steps.filter.outputs.workflows }}
      code: ${{ steps.filter.outputs.code }}
      config: ${{ steps.filter.outputs.config }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check which files changed
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - '**/*.md'
              - 'examples/**'
              - '.private/**'
            workflows:
              - '.github/workflows/**'
            code:
              - 'packages/*/src/**'
              - 'packages/**/*.ts'
              - 'packages/**/*.tsx'
              - '*.ts'
              - '*.tsx'
            config:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '**/package.json'
              - '**/tsconfig.json'
              - '.prettierrc*'
              - '.eslintrc*'

  # Job 1: Install dependencies (required by all other jobs)
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.config == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: |
            **/node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

  # Job 2: Format check (always runs - checks all file types)
  format:
    name: Format Check
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Restore node_modules cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            **/node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run format check
        run: pnpm format:check

  # Job 3: Lint check (after build, needs type definitions) - only for code changes
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.config == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Restore node_modules cache
        id: cache-restore-nm
        uses: actions/cache/restore@v4
        with:
          path: |
            **/node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore-nm.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Restore build cache
        id: cache-restore-build
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/*/dist
            packages/*/tsconfig.tsbuildinfo
          key: ${{ runner.os }}-build-${{ hashFiles('packages/*/src/**/*', 'packages/*/tsconfig.json', 'pnpm-lock.yaml') }}

      - name: Build packages (if cache miss)
        if: steps.cache-restore-build.outputs.cache-hit != 'true'
        run: pnpm build

      - name: Run lint
        run: pnpm lint

  # Job 4: Build (after install, before typecheck and test) - only for code changes
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [detect-changes, install]
    if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.config == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Restore node_modules cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            **/node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Cache build output
        uses: actions/cache/save@v4
        with:
          path: |
            packages/*/dist
            packages/*/tsconfig.tsbuildinfo
          key: ${{ runner.os }}-build-${{ hashFiles('packages/*/src/**/*', 'packages/*/tsconfig.json', 'pnpm-lock.yaml') }}

  # Job 5: Type check (after build, needs .d.ts files) - only for code changes
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.config == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Restore node_modules cache
        id: cache-restore-nm
        uses: actions/cache/restore@v4
        with:
          path: |
            **/node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore-nm.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Restore build cache
        id: cache-restore-build
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/*/dist
            packages/*/tsconfig.tsbuildinfo
          key: ${{ runner.os }}-build-${{ hashFiles('packages/*/src/**/*', 'packages/*/tsconfig.json', 'pnpm-lock.yaml') }}

      - name: Build packages (if cache miss)
        if: steps.cache-restore-build.outputs.cache-hit != 'true'
        run: pnpm build

      - name: Run typecheck
        run: pnpm typecheck

  # Job 6: Test (after build, needs built packages) - only for code changes
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.config == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Restore node_modules cache
        id: cache-restore-nm
        uses: actions/cache/restore@v4
        with:
          path: |
            **/node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore-nm.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Restore build cache
        id: cache-restore-build
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/*/dist
            packages/*/tsconfig.tsbuildinfo
          key: ${{ runner.os }}-build-${{ hashFiles('packages/*/src/**/*', 'packages/*/tsconfig.json', 'pnpm-lock.yaml') }}

      - name: Build packages (if cache miss)
        if: steps.cache-restore-build.outputs.cache-hit != 'true'
        run: pnpm build

      - name: Run tests
        run: pnpm test:run

  # Job 7: Coverage (after build, checks coverage thresholds) - only for code changes
  coverage:
    name: Coverage Check
    runs-on: ubuntu-latest
    needs: [detect-changes, build]
    if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.config == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Restore node_modules cache
        id: cache-restore-nm
        uses: actions/cache/restore@v4
        with:
          path: |
            **/node_modules
            ~/.pnpm-store
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore-nm.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Restore build cache
        id: cache-restore-build
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/*/dist
            packages/*/tsconfig.tsbuildinfo
          key: ${{ runner.os }}-build-${{ hashFiles('packages/*/src/**/*', 'packages/*/tsconfig.json', 'pnpm-lock.yaml') }}

      - name: Build packages (if cache miss)
        if: steps.cache-restore-build.outputs.cache-hit != 'true'
        run: pnpm build

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/*/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            packages/*/coverage/
          retention-days: 30

      - name: Comment coverage summary on PR
        uses: romeovs/lcov-reporter-action@v0.3.1
        if: github.event_name == 'pull_request'
        with:
          lcov-file: ./packages/core/coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          delete-old-comments: true

  # Final status check (all jobs must pass or be skipped)
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [format, lint, build, typecheck, test, coverage]
    if: always()
    steps:
      - name: Check job results
        run: |
          # Format always runs and must succeed
          if [ "${{ needs.format.result }}" != "success" ]; then
            echo "❌ Format check failed or was cancelled"
            exit 1
          fi

          # Code quality jobs are conditional - allow success or skipped
          if [ "${{ needs.lint.result }}" != "success" ] && [ "${{ needs.lint.result }}" != "skipped" ]; then
            echo "❌ Lint check failed or was cancelled"
            exit 1
          fi

          if [ "${{ needs.build.result }}" != "success" ] && [ "${{ needs.build.result }}" != "skipped" ]; then
            echo "❌ Build failed or was cancelled"
            exit 1
          fi

          if [ "${{ needs.typecheck.result }}" != "success" ] && [ "${{ needs.typecheck.result }}" != "skipped" ]; then
            echo "❌ Type check failed or was cancelled"
            exit 1
          fi

          if [ "${{ needs.test.result }}" != "success" ] && [ "${{ needs.test.result }}" != "skipped" ]; then
            echo "❌ Tests failed or were cancelled"
            exit 1
          fi

          if [ "${{ needs.coverage.result }}" != "success" ] && [ "${{ needs.coverage.result }}" != "skipped" ]; then
            echo "❌ Coverage check failed or was cancelled"
            exit 1
          fi

          echo "✅ All CI checks passed!"
